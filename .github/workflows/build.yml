name: Build Eight Echo

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target EightEcho_VST3
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: EightEcho-VST3-Windows
          path: build/EightEcho_artefacts/Release/VST3/Eight Echo.vst3

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build VST3 + AU
        run: |
          cmake --build build --config Release --target EightEcho_VST3
          cmake --build build --config Release --target EightEcho_AU
      - name: Zip
        run: |
          cd build/EightEcho_artefacts/Release
          zip -r -y ../../../EightEcho-macOS.zip "VST3/Eight Echo.vst3" "AU/Eight Echo.component"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EightEcho-macOS
          path: EightEcho-macOS.zip
